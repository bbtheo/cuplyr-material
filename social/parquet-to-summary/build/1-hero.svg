<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0f1419"/><text x="80" y="120" font-family="Adwaita Sans, sans-serif" font-size="64" font-weight="700" fill="#f2f4f7">Parquet to summary,</text><text x="80" y="195" font-family="Adwaita Sans, sans-serif" font-size="64" font-weight="700" fill="#2fd08f">100M rows in 145 ms</text><text x="80" y="245" font-family="Adwaita Sans, sans-serif" font-size="26" fill="#8b95a3">read, filter, mutate, group by 2 keys, summarise: one call, result back in R. The filter cannot skip any of the file.</text><text x="376" y="372" text-anchor="end" font-family="Adwaita Sans, sans-serif" font-size="30" fill="#f2f4f7">cuplyr (GPU)</text><rect x="400" y="330" width="12.3" height="64" rx="8" fill="#2fd08f"/><text x="430.3" y="375" font-family="Adwaita Sans, sans-serif" font-size="34" font-weight="700" fill="#f2f4f7">145 ms</text><text x="376" y="487" text-anchor="end" font-family="Adwaita Sans, sans-serif" font-size="30" fill="#f2f4f7">DuckDB</text><rect x="400" y="445" width="17.0" height="64" rx="8" fill="#f0a830"/><text x="435.0" y="490" font-family="Adwaita Sans, sans-serif" font-size="34" font-weight="700" fill="#f2f4f7">200 ms</text><text x="585.0" y="490" font-family="Adwaita Sans, sans-serif" font-size="26" fill="#8b95a3">1.4x slower</text><text x="376" y="602" text-anchor="end" font-family="Adwaita Sans, sans-serif" font-size="30" fill="#f2f4f7">dplyr + arrow</text><rect x="400" y="560" width="563.8" height="64" rx="8" fill="#4aa3ff" fill-opacity="0.45"/><rect x="963.8" y="560" width="196.2" height="64" rx="8" fill="#4aa3ff"/><rect x="963.8" y="560" width="16" height="64" fill="#4aa3ff"/><text x="681.9" y="600" text-anchor="middle" font-family="Adwaita Sans, sans-serif" font-size="24" font-weight="700" fill="#0f1419">read into R 6.6 s</text><text x="1061.9" y="600" text-anchor="middle" font-family="Adwaita Sans, sans-serif" font-size="21" font-weight="700" fill="#0f1419">compute 2.3 s</text><text x="1178.0" y="605" font-family="Adwaita Sans, sans-serif" font-size="34" font-weight="700" fill="#f2f4f7">8.9 s</text><text x="1298.0" y="605" font-family="Adwaita Sans, sans-serif" font-size="26" fill="#8b95a3">62x slower</text><text x="376" y="717" text-anchor="end" font-family="Adwaita Sans, sans-serif" font-size="30" fill="#f2f4f7">data.table</text><rect x="400" y="675" width="451.6" height="64" rx="8" fill="#d98ac0" fill-opacity="0.45"/><rect x="851.6" y="675" width="169.9" height="64" rx="8" fill="#d98ac0"/><rect x="851.6" y="675" width="16" height="64" fill="#d98ac0"/><text x="625.8" y="715" text-anchor="middle" font-family="Adwaita Sans, sans-serif" font-size="24" font-weight="700" fill="#0f1419">read into R 5.3 s</text><text x="936.5" y="715" text-anchor="middle" font-family="Adwaita Sans, sans-serif" font-size="21" font-weight="700" fill="#0f1419">compute 2.0 s</text><text x="1039.5" y="720" font-family="Adwaita Sans, sans-serif" font-size="34" font-weight="700" fill="#f2f4f7">7.3 s</text><text x="1159.5" y="720" font-family="Adwaita Sans, sans-serif" font-size="26" fill="#8b95a3">51x slower</text><text x="400" y="772" font-family="Adwaita Sans, sans-serif" font-size="22" fill="#8b95a3">cuplyr and DuckDB read and compute in one fused pass, so their bars are not split.</text><text x="400" y="800" font-family="Adwaita Sans, sans-serif" font-size="22" fill="#8b95a3">For dplyr and data.table, compute is timed on data already loaded in R.</text><text x="80" y="850" font-family="Adwaita Sans, sans-serif" font-size="22" fill="#8b95a3">100M-row fact table in parquet. Median of 5 runs, warm file cache. RTX 5070 vs i9-12900K. dplyr and data.table both read with arrow.</text></svg>