<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0f1419"/><text x="80" y="115" font-family="Adwaita Sans, sans-serif" font-size="58" font-weight="700" fill="#f2f4f7">Where the GPU wins,</text><text x="80" y="185" font-family="Adwaita Sans, sans-serif" font-size="58" font-weight="700" fill="#f0a830">and where DuckDB does</text><text x="80" y="235" font-family="Adwaita Sans, sans-serif" font-size="26" fill="#8b95a3">Time for 100M rows, parquet to summary. Shorter bar is faster (log scale).</text><text x="80" y="300" font-family="Adwaita Sans, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">filter, mutate,</text><text x="80" y="334" font-family="Adwaita Sans, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">group by 2 keys</text><rect x="80" y="380" width="95.7" height="52" rx="7" fill="#2fd08f"/><text x="187.7" y="417" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">145 ms</text><rect x="80" y="472" width="111.4" height="52" rx="7" fill="#f0a830"/><text x="203.4" y="509" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">200 ms</text><rect x="80" y="564" width="295.0" height="52" rx="7" fill="#4aa3ff"/><text x="387.0" y="601" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">8.9 s</text><rect x="80" y="656" width="285.3" height="52" rx="7" fill="#d98ac0"/><text x="377.3" y="693" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">7.3 s</text><text x="580" y="300" font-family="Adwaita Sans, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">plus a join to</text><text x="580" y="334" font-family="Adwaita Sans, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">the store table</text><rect x="580" y="380" width="118.2" height="52" rx="7" fill="#2fd08f"/><text x="710.2" y="417" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">231 ms</text><rect x="580" y="472" width="107.3" height="52" rx="7" fill="#f0a830"/><text x="699.3" y="509" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">184 ms</text><rect x="580" y="564" width="303.1" height="52" rx="7" fill="#4aa3ff"/><text x="895.1" y="601" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">10.6 s</text><rect x="580" y="656" width="289.7" height="52" rx="7" fill="#d98ac0"/><text x="881.7" y="693" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">8.0 s</text><text x="1080" y="300" font-family="Adwaita Sans, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">group by product,</text><text x="1080" y="334" font-family="Adwaita Sans, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">top 10</text><rect x="1080" y="380" width="99.1" height="52" rx="7" fill="#2fd08f"/><text x="1191.1" y="417" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">155 ms</text><rect x="1080" y="472" width="136.8" height="52" rx="7" fill="#f0a830"/><text x="1228.8" y="509" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">339 ms</text><rect x="1080" y="564" width="294.0" height="52" rx="7" fill="#4aa3ff"/><text x="1386.0" y="601" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">8.8 s</text><rect x="1080" y="656" width="285.0" height="52" rx="7" fill="#d98ac0"/><text x="1377.0" y="693" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#f2f4f7">7.3 s</text><rect x="80" y="770" width="22" height="22" rx="5" fill="#2fd08f"/><text x="112" y="789" font-family="Adwaita Sans, sans-serif" font-size="24" fill="#f2f4f7">cuplyr (GPU)</text><rect x="420" y="770" width="22" height="22" rx="5" fill="#f0a830"/><text x="452" y="789" font-family="Adwaita Sans, sans-serif" font-size="24" fill="#f2f4f7">DuckDB</text><rect x="760" y="770" width="22" height="22" rx="5" fill="#4aa3ff"/><text x="792" y="789" font-family="Adwaita Sans, sans-serif" font-size="24" fill="#f2f4f7">dplyr + arrow</text><rect x="1100" y="770" width="22" height="22" rx="5" fill="#d98ac0"/><text x="1132" y="789" font-family="Adwaita Sans, sans-serif" font-size="24" fill="#f2f4f7">data.table</text><text x="80" y="850" font-family="Adwaita Sans, sans-serif" font-size="22" fill="#8b95a3">Median of 5 runs, warm file cache. RTX 5070 vs i9-12900K. The join is cuplyr's weak spot at this size.</text></svg>