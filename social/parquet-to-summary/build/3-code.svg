<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0f1419"/><text x="80" y="115" font-family="Adwaita Sans, sans-serif" font-size="58" font-weight="700" fill="#f2f4f7">Same dplyr code.</text><text x="80" y="185" font-family="Adwaita Sans, sans-serif" font-size="58" font-weight="700" fill="#2fd08f">Different engine.</text><rect x="80" y="235" width="1440" height="400" rx="18" fill="#161d26" stroke="#232b36" stroke-width="2"/><text x="124" y="300" xml:space="preserve" font-family="Adwaita Mono, monospace" font-size="31" fill="#f2f4f7">read_parquet_gpu("sales.parquet") |&gt;</text><text x="124" y="352" xml:space="preserve" font-family="Adwaita Mono, monospace" font-size="31" fill="#f2f4f7">  filter(price &gt;= 150, channel != "phone") |&gt;</text><text x="124" y="404" xml:space="preserve" font-family="Adwaita Mono, monospace" font-size="31" fill="#f2f4f7">  mutate(revenue = price * qty * (1 - discount)) |&gt;</text><text x="124" y="456" xml:space="preserve" font-family="Adwaita Mono, monospace" font-size="31" fill="#f2f4f7">  group_by(store, channel) |&gt;</text><text x="124" y="508" xml:space="preserve" font-family="Adwaita Mono, monospace" font-size="31" fill="#f2f4f7">  summarise(n = n(), revenue = sum(revenue),</text><text x="124" y="560" xml:space="preserve" font-family="Adwaita Mono, monospace" font-size="31" fill="#f2f4f7">            avg_price = mean(price), max_qty = max(qty)) |&gt;</text><text x="124" y="612" xml:space="preserve" font-family="Adwaita Mono, monospace" font-size="31" fill="#2fd08f">  collect()</text><text x="80" y="720" font-family="Adwaita Sans, sans-serif" font-size="34" fill="#f2f4f7">100M rows, 773 MB of parquet, 2 keys, 4 aggregates:</text><text x="80" y="785" font-family="Adwaita Sans, sans-serif" font-size="48" font-weight="700" fill="#2fd08f">145 ms</text><text x="250" y="783" font-family="Adwaita Sans, sans-serif" font-size="30" fill="#8b95a3">on the GPU, vs 8.9 s for dplyr and 200 ms for DuckDB</text><text x="80" y="850" font-family="Adwaita Sans, sans-serif" font-size="22" fill="#8b95a3">100M-row fact table in parquet. Median of 5 runs, warm file cache. RTX 5070 vs i9-12900K. </text></svg>